services:
  postgres:
    image: postgres:16-alpine
    container_name: kamara-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: kamara
      POSTGRES_PASSWORD: kamara_dev
      POSTGRES_DB: kamara

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U kamara -d kamara"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    container_name: kamara-minio
    restart: unless-stopped

    command:
      server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: kamara
      MINIO_ROOT_PASSWORD: kamara_minio_dev

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_data:/data

  ai-service:
    build:
      context: ./apps/ai-service/backend
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      KAMARA_VISUAL_MODEL_DIR: /models/visual
      KAMARA_NLP_MODEL_DIR: /models/nlp
      PYTHONUNBUFFERED: "1"

    ports:
      - "8000:8000"

    volumes:
      - ./ml/artifacts/computer-vision/kamara_visual_mobilenet_v3_large_v1:/models/visual:ro
      - ./ml/artifacts/nlp/kamara_bertimbau_v2:/models/nlp:ro

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/backend/Dockerfile

    restart: unless-stopped

    env_file:
      - ./apps/api/backend/.env

    environment:
      NODE_ENV: development
      PORT: "3333"

      DATABASE_URL: "postgresql://kamara:kamara_dev@postgres:5432/kamara?schema=public"

      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_REGION: "us-east-1"
      STORAGE_BUCKET: "kamara-media"
      STORAGE_ACCESS_KEY: "kamara"
      STORAGE_SECRET_KEY: "kamara_minio_dev"
      STORAGE_FORCE_PATH_STYLE: "true"

      AI_SERVICE_URL: "http://ai-service:8000"
      AI_SERVICE_TIMEOUT_MS: "5000"
      AI_PREANALYSIS_ENABLED: "true"

    ports:
      - "3333:3333"

    depends_on:
      postgres:
        condition: service_healthy

      minio:
        condition: service_started

      ai-service:
        condition: service_healthy

  mobile-frontend:
    build:
      context: .
      dockerfile: apps/mobile/frontend/Dockerfile

      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3333"

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3333"

    ports:
      - "3001:3001"

    depends_on:
      api:
        condition: service_started

  dashboard-frontend:
    build:
      context: .
      dockerfile: apps/dashboard/frontend/Dockerfile

      args:
        NEXT_PUBLIC_API_URL: "http://localhost:3333"

    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:3333"

    ports:
      - "3002:3002"

    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data: